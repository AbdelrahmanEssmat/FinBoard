<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- no viewport-fit=cover: in a home-screen app it makes iOS shrink the page by the status bar after the keyboard and never
         paint below that again (WebKit 254868/301857). iOS keeps the status bar and home indicator areas outside the page instead;
         they show the canvas colour, which matches the top and bottom bars. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161b24" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinBoard" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>FinBoard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
